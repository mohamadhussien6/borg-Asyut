name: Cloud release candidate
on:
  push:
    branches: [codex/cloud-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: borg-cloud-release
  cancel-in-progress: false
env:
  UNITY_VERSION: 6000.3.29f1
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: |
          git lfs fsck
          python -B -m unittest discover -s Tools -p 'test_*.py' -v
          python -B Tools/validate_project.py
          dotnet run --project Tools/LogicChecks/LogicChecks.csproj -- .
          mkdir -p cloud-reports
          cp Documentation/*Validation.json cloud-reports/
          python -m py_compile Tools/cloud_media.py Tools/cloud_release.py
          node --check Tools/cloud_browser.cjs
          python -m pip install Pillow imageio-ffmpeg
          python Tools/cloud_media.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-and-media
          path: |
            cloud-reports
            Publishing_Ready
          retention-days: 7
  license:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Check activation without disclosing credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ] || { [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; }; then
            echo "::error::Unity CI activation is not configured. No Unity build or test has run. Browser-only Unity Build Automation setup is documented in Publishing/CLOUD_ONLY.md. Never paste credentials into chat."
            exit 1
          fi
  tests:
    needs: [source, license]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: All
          coverageEnabled: false
          artifactsPath: cloud-tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-tests
          path: cloud-tests
          retention-days: 7
  captures:
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - name: Keep test-only captures inside cloud workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Assets/Ma3alem/Tests/PlayMode/GameplayTests.cs')
          text = p.read_text(encoding='utf8')
          assert '/../../../work/' in text
          p.write_text(text.replace('/../../../work/', '/../cloud-captures/'), encoding='utf8')
          PY
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          coverageEnabled: false
          artifactsPath: cloud-capture-tests
          customParameters: '-testFilter "Ma3alem.Tests.GameplayTests.CaptureCurrentRuntimeAuditAndMeasurements;Ma3alem.Tests.GameplayTests.ArcadeWallBounceFootage;Ma3alem.Tests.GameplayTests.PolishJumpAndWallFootage;Ma3alem.Tests.GameplayTests.BuildingJoinPreview;Ma3alem.Tests.GameplayTests.StaticEnvironmentZoneScreenshots;Ma3alem.Tests.GameplayTests.PlayfieldBoundaryScreenshots;Ma3alem.Tests.GameplayTests.NeighborhoodPresentationActivePhysics;Ma3alem.Tests.GameplayTests.PolishPresentationAndFrameTimes;Ma3alem.Tests.GameplayTests.GitHubFeatureTourCapture;Ma3alem.Tests.GameplayTests.FinalGameplayVideo;Ma3alem.Tests.GameplayTests.SmallVisualFixCaptures;Ma3alem.Tests.GameplayTests.MainMenuSloganArabicCaptures;Ma3alem.Tests.GameplayTests.VisualIdentityCaptures"'
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Bound cloud evidence storage
        if: always()
        run: python Tools/cloud_capture_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explicit-capture-tests
          path: |
            cloud-capture-tests
            capture-evidence
          retention-days: 1
  build:
    needs: [tests, captures]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: StandaloneWindows64
            method: Windows
            name: windows
          - target: WebGL
            method: Web
            name: web
          - target: StandaloneWindows64
            method: VerifyWindows
            name: verification
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.target }}
          buildMethod: Ma3alem.Editor.CloudBuilds.${{ matrix.method }}
          versioning: None
      - uses: actions/upload-artifact@v4
        with:
          name: player-${{ matrix.name }}
          path: Builds/Store
          retention-days: 7
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: player-verification
          path: player
      - name: Exercise native physics and four zones
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'native-report'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $player = Join-Path $env:GITHUB_WORKSPACE 'player/Verification/Borg Asyut.exe'
          $arguments = @('-batchmode', '-force-d3d11', '--verify-gameplay', '--verify-output', ('"' + $out + '"'), '--verify-seconds', '180', '--verify-audit', '1', '--verify-width', '1920', '--verify-height', '1080', '-logFile', ('"' + (Join-Path $out 'Player.log') + '"'))
          $p = Start-Process -FilePath $player -ArgumentList $arguments -PassThru
          if (!$p.WaitForExit(480000)) { $p.Kill(); throw 'Cloud native run timed out' }
          if ($p.ExitCode -ne 0) { throw "Native player exited $($p.ExitCode)" }
          $r = Get-Content (Join-Path $out 'result.json') -Raw | ConvertFrom-Json
          if ($r.errors -ne 0 -or $r.zonesSeenMask -ne 15 -or !$r.physicsActive -or !$r.bestScorePersisted -or $r.jumps -lt 1) { throw 'Native assertions failed' }
          $r | ConvertTo-Json -Depth 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tests
          path: native-report
          retention-days: 7
  browser:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: player-web
          path: player
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox
          python -m http.server 8765 --directory player/Web > /tmp/borg-http.log 2>&1 &
          node Tools/cloud_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-tests
          path: browser-report
          retention-days: 7
  draft:
    if: always()
    needs: [source, license, tests, captures, build, windows, browser]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/download-artifact@v4
        with:
          path: cloud-artifacts
      - name: Assemble truthful private draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python Tools/cloud_release.py
